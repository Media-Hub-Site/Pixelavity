<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixelavity // Antigravity Live Visualizer</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- BARRA SUPERIOR LIMPIA -->
    <header class="topbar">
      <div class="brand-group">
        <div class="pixel-logo">PX</div>
        <div class="brand-copy">
          <div class="brand-title">
            PIXELAVITY <span class="brand-tag">ANTIGRAVITY</span>
          </div>
          <div class="brand-subtitle">MediaHub · Modo Espectador en Tiempo Real</div>
        </div>
      </div>

      <div class="status-group">
        <div class="conn-pill" id="connPill">
          <span class="pulse-dot"></span>
          <span id="connText">EN VIVO</span>
        </div>

        <div class="stats-inline">
          <span class="stat-pill"><strong id="statChats">0</strong> chats</span>
          <span class="stat-sep">·</span>
          <span class="stat-pill"><strong id="statSubs">0</strong> subagentes</span>
        </div>

        <div class="filter-toggle" role="group" aria-label="Filtro de agentes">
          <button class="btn-chip active" id="btnFilterAll" title="Mostrar chats activos y sesiones recientes">Todos</button>
          <button class="btn-chip" id="btnFilterLive" title="Mostrar únicamente chats activos ahora">Activos</button>
        </div>
      </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="main-grid">
      <!-- ESCENARIO PIXEL ART (100% ESPACIO PARA EL MAPA) -->
      <section class="stage-section">
        <div class="canvas-wrapper" id="canvasWrapper">
          <canvas id="pixelCanvas" width="1040" height="620"></canvas>
        </div>
      </section>

      <!-- PANEL LATERAL: INSPECTOR, AGENTES Y TELEMETRÍA -->
      <aside class="sidebar">
        <div class="panel-card inspector-card" id="inspectorCard">
          <div class="panel-header">
            <span>INSPECTOR</span>
            <span class="badge-mini" id="inspTypeBadge">ESPECTADOR</span>
          </div>
          <div class="inspector-body" id="inspectorBody">
            <p class="empty-hint">Haz clic en un personaje para ver su modelo y actividad actual.</p>
          </div>
        </div>

        <div class="panel-card agents-card">
          <div class="panel-header">
            <span>AGENTES</span>
            <span class="badge-mini" id="agentCountBadge">0</span>
          </div>
          <div class="agents-list" id="agentsList"></div>
        </div>

        <div class="panel-card feed-card">
          <div class="panel-header">
            <span>ACTIVIDAD RECIENTE</span>
            <span class="badge-mini live-tag">LIVE</span>
          </div>
          <div class="feed-list" id="feedList"></div>
        </div>
      </aside>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
